services:
  - type: web
    name: neuroquest
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.18.0
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_TEAM
        value: abrar
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGIN
        sync: false
    # To enable persistent disk on a paid plan ($7/mo + $0.25/GB), uncomment below:
    # disk:
    #   name: neuroquest-data
    #   mountPath: /opt/render/project/src/server/data
    #   sizeGB: 1

